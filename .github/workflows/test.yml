name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  dotfiles-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install test tooling
        run: brew install bats-core shellcheck neovim
      - name: Run lint, smoke and behaviour suites
        run: bin/dotfiles-test
